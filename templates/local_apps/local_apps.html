<div id="app-list" class="grid grid-cols-3 gap-6 place-items-evenly">
    <div hx-target="closest section" hx-swap="outerHTML">
        {% for app in applications %}
        <section class="card card-border bg-base-200 border-neutral text-base-content" hx-get="/local-apps/{{app.id}}" hx-trigger="load">
        </section>
        {% endfor %}

    </div>

    <div class="card card-border bg-base-200 border-neutral text-base-content">
        <div class="card-body">
            <div class="card-actions justify-evenly">
                <button class="btn bg-accent text-accent-content" hx-get="/local-apps/new">
                    <img class="block-1/2 fill-accent-content" src="static/icons/new.svg" />
                    <span>Add a New Application</span>
                </button>
            </div>
        </div>
    </div>
</div>
