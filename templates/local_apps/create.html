<section hx-trigger='cancel'>
    <div class="card card-border bg-base-200 border-neutral text-base-content px-4">
        <div class="card-body">
            <form>
                <fieldset class="fieldset">
                    <label class="input">
                        <span class="label">Name</span>
                        <input name='name' class="input">
                    </label>

                    <label class="input">
                        <span class="label">Slug</span>
                        <input name='slug' class="input">
                    </label>

                    <label class="input">
                        <span class="label">Icon</span>
                        <input name='icon' class="input">
                    </label>

                    <label class="input">
                        <span class="label">Group</span>
                        <input name='group' class="input">
                    </label>

                    <label>
                        <span class="label">Description</span>
                        <textarea name='description' class="textarea"></textarea>
                    </label>

                    <label class="input">
                        <span class="label">URL</span>
                        <input name='launch_url' class="input">
                    </label>
                </fieldset>

                <div class="card-actions justify-evenly">
                    <input name="source" type="hidden" value="Local" />
                    <button class="btn is-warning" _="on click send newApp to #local-apps">
                        <span class="icon is-small"><img src="/static/icons/cancel.svg" /></span>
                        <span>Cancel</span>
                    </button>

                    <button class="btn is-primary" hx-trigger="click" hx-post="/local-apps" hx-include="closest section">
                        <span class="icon is-small"><img src="/static/icons/save.svg" /></span>
                        <span>Save</span>
                    </button>
                </div>
            </form>

        </div>
    </div>
</section>
