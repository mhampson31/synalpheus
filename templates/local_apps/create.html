<section hx-trigger='cancel'>
    <div class="card">
        <div class="card-body">
            <form>
                <fieldset class="fieldset">
                    <label class="input">
                        <span class="label">Name</span>
                        <input name='name' class="input">
                    </label>

                    <label class="input">
                        <span class="label">Slug</span>
                        <input name='slug' class="input">
                    </label>

                    <label class="input">
                        <span class="label">Icon</span>
                        <input name='icon' class="input">
                    </label>

                    <label class="input">
                        <span class="label">Group</span>
                        <input name='group' class="input">
                    </label>

                    <label>
                        <span class="label">Description</span>
                        <textarea name='description' class="textarea"></textarea>
                    </label>

                    <label class="input">
                        <span class="label">URL</span>
                        <input name='launch_url' class="input">
                    </label>
                </fieldset>

                <div class="card-actions justify-end">
                    <input name="source" type="hidden" value="Local" />
                    <button class="btn bg-warning/50 text-warning-content" _="on click send newApp to #local-apps">
                        {{ <cancel_icon />}}
                        <span>Cancel</span>
                    </button>

                    <button class="btn bg-primary/50 text-primary-content" hx-trigger="click" hx-post="/local-apps" hx-include="closest section">
                        {{ <save_icon /> }}
                        <span>Save</span>
                    </button>
                </div>
            </form>

        </div>
    </div>
</section>
