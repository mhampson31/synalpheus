
<div id="icon-form" class="modal is-active is-clipped"
    _="on iconSaved_{{app.id}} remove .is-active from #icon-form then remove #icon-form">
    <div class="modal-background"></div>
    <div class="modal-card">
        <header class="modal-card-head">
            <p class="modal-card-title"></p>
        </header>
        <section class="modal-card-body">
            
        </section>
        <footer class="modal-card-foot">
            <div class="buttons">
                <button class="button is-success" form="icon-form-{{app.id}}">
                    {{ <save_icon /> }}
                    <span>Save changes</span>
                </button>
                <button class="button" _="on click remove .is-active from #icon-form then remove #icon-form">
                    {{ <cancel_icon /> }}
                    <span>Cancel</span>
                </button>
            </div>
        </footer>
    </div>
</div>
